        const storedMatches = (await db.ref('matches').once('value')).val() || {};

    function calcPoints(real, predicted) {
        if (!real || !predicted) return 0;
        const [r1, r2] = real.split(':').map(Number);
        const [p1, p2] = predicted.split(':').map(Number);
        if (isNaN(r1) || isNaN(r2) || isNaN(p1) || isNaN(p2)) return 0;
        if (r1 === p1 && r2 === p2) return 3;
        if ((r1 - r2) === (p1 - p2)) return 2;
        const realWinner = r1 > r2 ? 1 : (r1 < r2 ? 2 : 0);
        const predWinner = p1 > p2 ? 1 : (p1 < p2 ? 2 : 0);
        return realWinner === predWinner ? 1 : 0;
    }

    async function saveRealScore(matchId, score) {
        if (!isAdmin) return false;
        await db.ref(`matches/${matchId}`).set({ real_score: score });
        const match = matchesState.find(m => m.id == matchId);
        if (match) match.real_score = score;
        await recalcPointsForMatch(matchId);
        return true;
    }

    async function recalcPointsForMatch(matchId) {
        const match = matchesState.find(m => m.id == matchId);
        if (!match || !match.real_score) return;
        const allPredictions = (await db.ref('predictions').once('value')).val() || {};
        const updates = {};
        const userPointDeltas = {};
        for (const [userId, preds] of Object.entries(allPredictions)) {
            const pred = preds[matchId];
            if (!pred) continue;
            const oldPoints = pred.points || 0;
            const newPoints = calcPoints(match.real_score, pred.score);
            if (oldPoints !== newPoints) {
                updates[`predictions/${userId}/${matchId}/points`] = newPoints;
                userPointDeltas[userId] = (userPointDeltas[userId] || 0) + (newPoints - oldPoints);
            }
        }
        if (Object.keys(updates).length > 0) await db.ref().update(updates);
        for (const [userId, delta] of Object.entries(userPointDeltas)) {
            if (delta !== 0) await db.ref(`users/${userId}/totalPoints`).transaction(current => (current || 0) + delta);
        }
    }

    async function savePrediction(matchId, score) {
        if (!currentUserKey) return;
        const match = matchesState.find(m => m.id == matchId);
        if (match && new Date(match.start_time).getTime() <= Date.now()) {
            throw new Error("Матч уже начался, прогноз нельзя изменить!");
        }
        if (!/^\d+:\d+$/.test(score)) {
            throw new Error("Счёт должен быть в формате X:Y (только цифры)");
        }
        await db.ref(`predictions/${currentUserKey}/${matchId}`).set({
            score: score,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
        });
        myPredictions[matchId] = { score, points: match.real_score ? calcPoints(match.real_score, score) : 0 };
        if (match && match.real_score) {
            await recalcPointsForMatch(matchId);
        }
    }

            .sort((a, b) => b.points - a.points);

            const toggleBtnHTML = finishedHtml ? `<button id="toggleFinishedBtn" style="margin-top:10px;">📋 Показать завершённые матчи (${finishedCount})</button>
                <div id="finishedMatches" style="display:none;">${finishedHtml}</div>` : '';

            document.getElementById('content').innerHTML = `

                <p style="margin:5px 0;color:#ffd966;">💡 Можно сохранять по одному матчу или все изменённые разом</p>

                    const matchId = parseInt(btn.dataset.id);
                    const inp1 = document.getElementById(`pred1_${matchId}`);
                    const inp2 = document.getElementById(`pred2_${matchId}`);

                    const val2 = inp2.value.trim();
                    if (val1 === '' && val2 === '') { alert('Введите счёт'); return; }
                    if ((val1 !== '' && val2 === '') || (val1 === '' && val2 !== '')) { alert('Заполните оба поля'); return; }
                    if (!/^\d+$/.test(val1) || !/^\d+$/.test(val2)) { alert('Только цифры'); return; }

                        await savePrediction(matchId, score);
                        document.getElementById(`saved_${matchId}`).style.display = 'inline-block';

                        if (match && match.real_score) {
                            document.getElementById(`status_${matchId}`).textContent = `✅ ${match.real_score}`;
                        }
                    } catch (e) {
                        alert(e.message);
                    } finally {
                        hideLoading();
                    }
                };

            // Сохранить все изменённые
            document.getElementById('saveAllBtn').onclick = async () => {
                const errorDiv = document.getElementById('predError');
                const msgDiv = document.getElementById('predMessage');
                errorDiv.style.display = 'none';
                msgDiv.style.display = 'none';
                let changed = 0, skipped = 0;
                showLoading();
                try {
                    const cards = document.querySelectorAll('.prediction-card');
                    for (const card of cards) {
                        const matchId = parseInt(card.dataset.matchId);
                        const inp1 = document.getElementById(`pred1_${matchId}`);
                        const inp2 = document.getElementById(`pred2_${matchId}`);
                        if (!inp1 || !inp2 || inp1.disabled || inp2.disabled) { skipped++; continue; }
                        const val1 = inp1.value.trim();
                        const val2 = inp2.value.trim();
                        if (val1 === '' && val2 === '') { skipped++; continue; }
                        if (val1 === '' || val2 === '') { skipped++; continue; }
                        if (!/^\d+$/.test(val1) || !/^\d+$/.test(val2)) { skipped++; continue; }
                        const newVal = `${val1}:${val2}`;
                        const oldVal = myPredictions[matchId]?.score || '';
                        if (newVal !== oldVal) {
                            await savePrediction(matchId, newVal);
                            changed++;
                        }
                    }
                    if (changed > 0) {
                        msgDiv.style.display = 'block';
                        msgDiv.textContent = `✅ Сохранено: ${changed}. Пропущено: ${skipped}.`;
                        await renderPredictionsPage();
                    } else if (skipped > 0) {
                        msgDiv.style.display = 'block';
                        msgDiv.textContent = `ℹ️ Нет новых прогнозов. Пропущено неполных: ${skipped}.`;
                    } else {
                        msgDiv.style.display = 'block';
                        msgDiv.textContent = 'ℹ️ Нет изменений для сохранения.';
                    }
                } catch (e) {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = e.message;
                } finally {
                    hideLoading();
                }
            };

            // Переключение завершённых матчей
            const toggleBtn = document.getElementById('toggleFinishedBtn');
            if (toggleBtn) {
                toggleBtn.onclick = () => {
                    const finishedDiv = document.getElementById('finishedMatches');

                    }
                };
            }
        } finally {

        }
    }

    // ==================== ПРОГНОЗЫ ВСЕХ (с сортировкой от новых к старым) ====================
    async function renderAllPredictionsPage() {
        showLoading();
        try {
            await loadMatches();
            const usersSnap = await db.ref('users').once('value');
            const users = usersSnap.val() || {};
            const allPredictionsSnap = await db.ref('predictions').once('value');
            const allPredictions = allPredictionsSnap.val() || {};
            const now = Date.now();

            // Фильтруем начавшиеся матчи и сортируем по убыванию времени (свежие сверху)
            const startedMatches = matchesState
                .filter(m => new Date(m.start_time).getTime() <= now)
                .sort((a, b) => new Date(b.start_time) - new Date(a.start_time));

            if (startedMatches.length === 0) {
                document.getElementById('content').innerHTML = `<h2>👥 Прогнозы всех</h2>
                    <p style="color:#ffd966;">Пока нет начавшихся матчей. Прогнозы будут видны после старта игры.</p>`;
                return;
            }
            let html = `<h2>👥 Прогнозы всех игроков</h2>
                <p style="margin:8px 0; color:#ffd966;">🔒 Прогнозы видны только после начала матча</p>`;
            for (const match of startedMatches) {
                const isFinished = !!match.real_score;
                const statusBadge = isFinished
                    ? '<span class="status-badge status-finished">Завершён</span>'
                    : '<span class="status-badge status-live">Идёт</span>';
                html += `<div class="match-block">
                    <h3>${getFlag(match.team1)} ${match.team1} – ${getFlag(match.team2)} ${match.team2} ${statusBadge}</h3>
                    <p style="margin-bottom:8px; color:#ffd966;">
                        📅 ${formatTimeMoscow(match.start_time)} | Группа ${match.group}, тур ${match.round}
                        ${isFinished ? ` | Реальный счёт: ${match.real_score}` : ' | Счёт пока неизвестен'}
                    </p>`;
                const predictionsForMatch = [];
                for (const [userId, userPreds] of Object.entries(allPredictions)) {
                    const pred = userPreds[match.id];
                    if (pred) {
                        const userName = users[userId] ? users[userId].name : 'Неизвестный';
                        const points = isFinished ? calcPoints(match.real_score, pred.score) : null;
                        predictionsForMatch.push({ userName, score: pred.score, points });
                    }
                }
                predictionsForMatch.sort((a, b) => {
                    if (a.points !== null && b.points !== null) return b.points - a.points;
                    return a.userName.localeCompare(b.userName);
                });
                if (predictionsForMatch.length === 0) {
                    html += `<p>Никто не сделал прогноз на этот матч.</p>`;
                } else {
                    html += `<table><tr><th>Игрок</th><th>Прогноз</th>${isFinished ? '<th>Очки</th>' : ''}</tr>`;
                    for (const p of predictionsForMatch) {
                        html += `<tr>
                            <td>${p.userName}</td>
                            <td>${p.score}</td>
                            ${isFinished ? `<td><b>${p.points}</b></td>` : ''}
                        </tr>`;
                    }
                    html += `</table>`;
                }
                html += `</div>`;
            }
            document.getElementById('content').innerHTML = html;
        } finally {
            hideLoading();
        }
    }

                };
            });

            document.querySelectorAll('.updatePointsBtn').forEach(btn => {
                btn.onclick = async () => {
                    const uid = btn.dataset.uid;
                    const newPointsInput = document.getElementById(`newPoints_${uid}`);
                    const newPoints = parseInt(newPointsInput.value);
                    if (isNaN(newPoints) || newPoints < 0) {
                        alert('Введите корректное число очков');
                        return;
                    }
                    showLoading();
                    try {
                        await db.ref(`users/${uid}/totalPoints`).set(newPoints);
                        document.getElementById(`currentPoints_${uid}`).textContent = newPoints;
                        alert('Очки обновлены!');
                    } catch (e) {
                        alert('Ошибка: ' + e.message);
                    } finally {
                        hideLoading();
                    }
                };
            });

        } finally {
            hideLoading();
        }
    }

    function setupNavigation() {
        document.getElementById('btnPredictions').onclick = () => renderPredictionsPage();
        document.getElementById('btnTable').onclick = () => renderTablePage();
        document.getElementById('btnMyHistory').onclick = () => renderMyHistoryPage();
        document.getElementById('btnAllPredictions').onclick = () => renderAllPredictionsPage();
        document.getElementById('btnAdmin').onclick = () => renderAdminPage();
        document.getElementById('btnLogout').onclick = () => logout();
    }

    async function init() {
        await initUsers();
        setupNavigation();
        const savedUid = localStorage.getItem('currentUserUid');
        if (savedUid) {
            showLoading();
            try {
                const userSnap = await db.ref(`users/${savedUid}`).once('value');
                const userData = userSnap.val();
                if (userData) {
                    currentUser = { name: userData.name };
                    currentUserKey = savedUid;
                    document.getElementById('navBar').style.display = 'flex';
                    document.getElementById('userInfo').style.display = 'block';
                    document.getElementById('userInfo').textContent = `Вы вошли как: ${userData.name}`;
                    await loadMatches();
                    await loadMyPredictions();
                    renderPredictionsPage();
                } else {
                    localStorage.removeItem('currentUserUid');
                    renderLoginForm();
                }
            } catch (e) {
                renderLoginForm();
            } finally {
                hideLoading();
            }
        } else {
            renderLoginForm();
        }
    }

    init();
</script>
</body>
</html>
